# Builds the mod developer guide (docs/modding, mkdocs.yml) and publishes it to GitHub Pages on each push to main
# that touches it, together with Lich's Maven repository (the maven branch, under /maven). release.yml runs it again
# after publishing a release to that branch. Pull requests only build it, so a broken link fails the PR. Needs
# Settings → Pages → Source: GitHub Actions.
name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: pip install -r docs/requirements.txt

      # strict (mkdocs.yml): broken links and anchors fail here.
      - run: mkdocs build

      # Lich's Maven repository (https://anti-2k.github.io/lich/maven): the API and the dev.lich.mod plugin of each
      # release, which release.yml publishes into the maven branch. After mkdocs build, which empties site/.
      - name: Maven repository
        run: |
          if git fetch --depth=1 origin maven; then
            mkdir -p site/maven
            git archive FETCH_HEAD | tar -x -C site/maven
          fi

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
