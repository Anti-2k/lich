[versions]
gson = "2.13.1"
# The versions Minecraft 1.7.10/1.8.9 put on the classpath. Lich compiles against them and never ships them.
log4j-legacy = "2.0-beta9"
gson-legacy = "2.2.4"
jopt-simple = "4.6"
commons-lang3-legacy = "3.3.2"
junit = "5.13.4"
# Lich ships ASM on the game's classpath and drops Forge's asm-all 5.0.3 (ASM 5 can't read Java 9+ classes).
asm = "9.8"
# Pack200 decoder for Forge's binpatches (java.util.jar.Pack200 is gone since Java 14). Nested inside
# lich-compat-jdk and loaded in isolation, so its commons-io/commons-lang3 never meet the game's older copies.
commons-compress = "1.27.1"
# Nashorn, gone from the JDK since 15 (JEP 372); scripting mods get the standalone one (jdk.nashorn renamed).
nashorn = "15.7"
# LWJGL 3 replaces the game's LWJGL 2 (compat-lwjgl2 rebuilds LWJGL 2's API on it). PLAN.md §2.5.
lwjgl3 = "3.3.6"
# The Mixin Lich mods get (PLAN.md §5.2): Fabric's fork of Mixin 0.8.7, which keeps the LaunchWrapper service, reads
# Java 25 class files (compatibility level JAVA_25) and needs neither Guava nor a newer Gson than the game's 2.2.4.
mixin = "0.17.3+mixin.0.8.7"
mixinextras = "0.5.0"
# Only to generate compat-lwjgl2's rename table from: the game's own LWJGL 2 (1.8.9's), from Mojang's repository.
lwjgl2 = "2.9.4-nightly-20150209"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
gson-legacy = { module = "com.google.code.gson:gson", version.ref = "gson-legacy" }
log4j-api-legacy = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j-legacy" }
log4j-core-legacy = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j-legacy" }
jopt-simple = { module = "net.sf.jopt-simple:jopt-simple", version.ref = "jopt-simple" }
commons-lang3-legacy = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3-legacy" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
asm-analysis = { module = "org.ow2.asm:asm-analysis", version.ref = "asm" }
asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
asm-util = { module = "org.ow2.asm:asm-util", version.ref = "asm" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
nashorn-core = { module = "org.openjdk.nashorn:nashorn-core", version.ref = "nashorn" }
lwjgl3 = { module = "org.lwjgl:lwjgl", version.ref = "lwjgl3" }
lwjgl3-glfw = { module = "org.lwjgl:lwjgl-glfw", version.ref = "lwjgl3" }
lwjgl3-opengl = { module = "org.lwjgl:lwjgl-opengl", version.ref = "lwjgl3" }
lwjgl3-openal = { module = "org.lwjgl:lwjgl-openal", version.ref = "lwjgl3" }
# Not used by LWJGL 2 code: mods written for LWJGL 3 environments (lwjgl3ify, Essential, ReplayMod, OneConfig) call them.
lwjgl3-stb = { module = "org.lwjgl:lwjgl-stb", version.ref = "lwjgl3" }
lwjgl3-tinyfd = { module = "org.lwjgl:lwjgl-tinyfd", version.ref = "lwjgl3" }
lwjgl3-tinyexr = { module = "org.lwjgl:lwjgl-tinyexr", version.ref = "lwjgl3" }
lwjgl3-nanovg = { module = "org.lwjgl:lwjgl-nanovg", version.ref = "lwjgl3" }
lwjgl2 = { module = "org.lwjgl.lwjgl:lwjgl", version.ref = "lwjgl2" }
mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "mixin" }
mixinextras = { module = "io.github.llamalad7:mixinextras-common", version.ref = "mixinextras" }
