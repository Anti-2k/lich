# Same coordinates as Lich's main build (../gradle.properties), so it can substitute dev.lich:remap-core.
group=dev.lich
version=0.4.0
# Publish next to the main build's modules (lich.publish), into one repository.
lich.mavenRepo=../build/maven

org.gradle.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.java.installations.auto-download=false
